<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <clipPath id="roundclip">
      <rect width="512" height="512" rx="96"/>
    </clipPath>
  </defs>
  <!-- Black body -->
  <rect width="512" height="512" rx="96" fill="#111111"/>
  <!-- Red band -->
  <rect y="380" width="512" height="66" fill="#DD0000" clip-path="url(#roundclip)"/>
  <!-- Gold band -->
  <rect y="446" width="512" height="66" fill="#FFCE00" clip-path="url(#roundclip)"/>
  <!-- Gold DE -->
  <text x="50%" y="205" text-anchor="middle" dominant-baseline="central" font-family="-apple-system,Segoe UI,Roboto,sans-serif" font-weight="700" font-size="220" fill="#FFCE00">DE</text>
  <circle cx="90" cy="78" r="22" fill="#60a5fa"/>
  <circle cx="154" cy="78" r="22" fill="#f87171"/>
  <circle cx="218" cy="78" r="22" fill="#4ade80"/>
</svg>
